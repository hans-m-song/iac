AWSTemplateFormatVersion: 2010-09-09
Description: Provides the infrastructure and role to enable Terraform deployments

Parameters:
  AllowAssumeRolePrincipalArns:
    Type: CommaDelimitedList
    Description: List of IAM Role ARNs allowed to assume the Terraform deploy role

Conditions:
  HasAllowAssumeRolePrincipalArns:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join:
              - ""
              - Ref: AllowAssumeRolePrincipalArns
          - ""

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: terraform-state-${AWS::AccountId}
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StateBucketArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: /infrastructure/terraform/state_bucket_arn
      Value:
        Fn::GetAtt: StateBucket.Arn

  StateBucketNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: /infrastructure/terraform/state_bucket_name
      Value:
        Ref: StateBucket

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: terraform-deploy-role
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sts:AssumeRole
            Principal:
              AWS: "*"
            Condition:
              ForAnyValue:ArnEquals:
                aws:PrincipalArn:
                  Fn::If:
                    - HasAllowAssumeRolePrincipalArns
                    - Ref: AllowAssumeRolePrincipalArns
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root

  DeployRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: /infrastructure/terraform/deploy_role_arn
      Value:
        Ref: DeployRole

  DeployRoleNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Name: /infrastructure/terraform/deploy_role_name
      Value:
        Ref: DeployRole

  StatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions to access Terraform state resources
      Path: /
      Roles:
        - Ref: DeployRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject*
              - s3:GetBucket*
              - s3:List*
              - s3:DeleteObject*
              - s3:PutObject
              - s3:PutObjectLegalHold
              - s3:PutObjectRetention
              - s3:PutObjectTagging
              - s3:PutObjectVersionTagging
              - s3:Abort*
            Resource:
              - Fn::GetAtt: StateBucket.Arn
              - Fn::Sub: ${StateBucket.Arn}/*
          - Effect: Allow
            Action:
              - s3:*
            NotResource:
              - Fn::GetAtt: StateBucket.Arn
              - Fn::Sub: ${StateBucket.Arn}/*

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions to deploy AWS resources
      Path: /
      Roles:
        - Ref: DeployRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/AWSCloudFormationStackSetExecutionRole
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*
            Condition:
              StringEquals:
                iam:PassedToService:
                  - cloudfront.amazonaws.com
                  - cloudtrail.amazonaws.com
                  - delivery.logs.amazonaws.com
                  - events.amazonaws.com
                  - firehose.amazonaws.com
                  - lambda.amazonaws.com
                  - logs.amazonaws.com
                  - pipes.amazonaws.com
                  - scheduler.amazonaws.com
          - Effect: Allow
            Action:
              # iam oidc
              - iam:AddClientIDToOpenIDConnectProvider
              - iam:CreateOpenIDConnectProvider
              - iam:DeleteOpenIDConnectProvider
              - iam:RemoveClientIDFromOpenIDConnectProvider
              - iam:UpdateOpenIDConnectProviderThumbprint
              # iam roles
              - iam:CreateRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:DeleteRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
              - iam:CreateServiceLinkedRole
              # iam groups
              - iam:CreateGroup
              - iam:UpdateGroup
              - iam:DeleteGroup
              - iam:AttachGroupPolicy
              - iam:DetachGroupPolicy
              # iam policies
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:Tag*
              - iam:Untag*
              - iam:List*
              - iam:Get*
              - route53:ChangeResourceRecordSets
              - route53:ChangeTagsForResource
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:DeleteParameter
              - ssm:DeleteParameters
              - ssm:DeleteResourcePolicy
              - ssm:PutParameter
            Resource:
              - "*"
          - Effect: Allow
            Action:
              - acm:*
              - apigateway:*
              - events:*
              - cloudformation:*
              - cloudfront:*
              - cloudtrail:*
              - firehose:*
              - lambda:*
              - logs:*
              - pipes:*
              - schemas:*
              - scheduler:*
              - sns:*
              - sqs:*
              - waf:*
              - wafv2:*
            Resource:
              - "*"
