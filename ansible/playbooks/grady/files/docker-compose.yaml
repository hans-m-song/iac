include:
  - docker-compose.buildsight.yaml
  - docker-compose.openobserve.yaml

services:
  traefik:
    container_name: traefik
    image: traefik:v3
    networks:
      - proxy
    environment:
      CF_DNS_API_TOKEN: "{{ cloudflare.dns_api_token }}"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: "{{ pointsman.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ pointsman.aws_secret_access_key }}"
    pull_policy: missing
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/traefik:/traefik
      - /opt/grady/traefik/static.yaml:/etc/traefik/traefik.yaml:ro
      - /opt/grady/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: traefik healthcheck --ping
      interval: 30s
      timeout: 1s
      retries: 3
      start_period: 10s

  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:latest
    networks:
      - proxy
    restart: unless-stopped
    ports:
      - 3001:3001/tcp
    volumes:
      - /opt/uptime-kuma:/app/data
    environment:
      - TZ=Australia/Brisbane
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    labels:
      traefik.enable: "true"
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"
      traefik.http.routers.uptime-kuma.rule: Host(`uptime.grady.axatol.xyz`)
      traefik.http.routers.uptime-kuma.tls.certresolver: cloudflare

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    networks:
      - proxy
    pull_policy: missing
    restart: unless-stopped
    pid: host
    user: 0:0
    ports:
      - 4317:4317
      - 4318:4318
      - 13133:13133
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - /opt/grady/otel-collector/default.yaml:/etc/otelcol-contrib/config.yaml

  crowdsec:
    container_name: crowdsec
    image: crowdsecurity/crowdsec:latest
    networks:
      - proxy
    pull_policy: missing
    restart: unless-stopped
    environment:
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/base-http-scenarios
        crowdsecurity/http-cve
        crowdsecurity/linux
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_traefik: "{{ crowdsec.lapi_key }}"
      GID: "989" # host docker group gid (getent group docker)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/grady/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /opt/grady/crowdsec/http.yaml:/etc/crowdsec/notifications/http.yaml:ro
      - /opt/grady/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - /opt/grady/crowdsec/appsec-detect.yaml:/etc/crowdsec/appsec-configs/detect-only.yaml:ro
      - /opt/grady/crowdsec/whitelists.yaml:/etc/crowdsec/parsers/s02-enrich/01-custom-whitelists.yaml:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
    healthcheck:
      test: cscli lapi status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true

volumes:
  crowdsec-db:
  crowdsec-config:
