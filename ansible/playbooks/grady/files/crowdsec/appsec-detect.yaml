name: custom/appsec-grady
# inband matches are blocked inline (403) and generate remediation-eligible alerts.
default_remediation: ban
# inband_rules take appsec-RULE names/globs (not collection names). base-config sets up the
# WAF engine; vpatch-* are the virtual-patching rules from crowdsecurity/appsec-virtual-patching.
inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
# CRS matches are evaluated out-of-band and do not block the matching request inline.
# Its correlation scenario is explicitly simulated in simulation.yaml so repeated
# matches remain observable without producing an IP decision during the trial.
outofband_rules:
  - crowdsecurity/crs
