name: custom/appsec-detect-only
# default_remediation: allow disables blocking; inband matches are logged as alerts only.
default_remediation: allow
# inband_rules take appsec-RULE names/globs (not collection names). base-config sets up the
# WAF engine; vpatch-* are the virtual-patching rules from crowdsecurity/appsec-virtual-patching.
inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
# Generic OWASP CRS rules (from crowdsecurity/appsec-generic-rules) are noisier; load them
# out-of-band (never blocking) once confirmed via `cscli appsec-rules list`:
# outofband_rules:
#   - crowdsecurity/crs
