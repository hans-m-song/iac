yaml-language-server: $schema=https://www.schemastore.org/traefik-v3-file-provider.json
http:
  middlewares:
    crowdsec:
      plugin:
        crowdsec:
          enabled: true
          logLevel: INFO
          crowdsecMode: stream
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec:8080
          crowdsecLapiKey: "{{ crowdsec.lapi_key }}"
          # Enforcing: AppSec inband matches block inline (403) and IP bans from
          # the ban_curated profile are enforced on routes using this middleware.
          crowdsecAppsecEnabled: true
          crowdsecAppsecHost: crowdsec:7422
          # Trusted IPs bypass both the decision check and AppSec — parser
          # whitelists don't cover the AppSec path, so this prevents self-lockout.
          clientTrustedIPs:
{% for ip in crowdsec.whitelisted_ips %}
            - "{{ ip }}/32"
{% endfor %}
