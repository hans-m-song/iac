services:
  node-exporter:
    container_name: node-exporter
    image: quay.io/prometheus/node-exporter:latest
    pull_policy: missing
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    ports:
      - 9100:9100
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:9100/ || exit 1
      interval: 30s
      timeout: 1s
      retries: 3
      start_period: 5s

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    pull_policy: missing
    restart: unless-stopped
    pid: host
    user: 0:0
    network_mode: host
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - /opt/atlas/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      DNSMASQ_USER: "{{ pihole.dnsmasq_user }}"
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_ratelimit_count: "0"
      FTLCONF_dns_upstreams: "unbound#5335"
      FTLCONF_misc_etc_dnsmasq_d: "true"
      FTLCONF_webserver_api_password: "{{ pihole.web_password }}"
      FTLCONF_webserver_domain: pihole.atlas.axatol.xyz
    ports:
      # dns
      - 53:53/tcp
      - 53:53/udp
      # web
      - 3001:80
    volumes:
      - /opt/pihole/etc-pihole:/etc/pihole
      - /opt/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      - /opt/atlas/custom.conf:/etc/dnsmasq.d/custom.conf:ro
    # healthcheck:
    #   test: curl --sSfL http://localhost/ || exit 1
    #   interval: 30s
    #   timeout: 1s
    #   retries: 3
    #   start_period: 1m
    depends_on:
      unbound:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.services.pihole.loadbalancer.server.port: "80"
      traefik.http.routers.pihole.rule: Host(`pihole.atlas.axatol.xyz`)
      traefik.http.routers.pihole.tls.certresolver: letsencrypt

  unbound:
    container_name: unbound
    image: klutchell/unbound:1.26.1
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - /opt/atlas/unbound.conf:/etc/unbound/unbound.conf:ro
      - unbound-state:/var/unbound
    healthcheck:
      test: ["CMD", "drill-hc", "-Q", "-p", "5335", "@127.0.0.1", "localhost"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 5s

  traefik:
    container_name: traefik
    image: traefik:v3
    command:
      # - --accesslog=true
      # - --accesslog.addinternals=true
      # - --accesslog.format=json
      - --api=true
      - --api.dashboard=true
      - --api.disabledashboardad=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log=true
      - --log.format=json
      - --log.level=DEBUG
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --certificatesresolvers.letsencrypt.acme.email={{ letsencrypt.email }}
      - --certificatesresolvers.letsencrypt.acme.storage=/traefik/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver={{ letsencrypt.caserver }}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
    environment:
      CF_DNS_API_TOKEN: "{{ cloudflare.dns_api_token }}"
    pull_policy: missing
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/traefik:/traefik
    healthcheck:
      test: traefik healthcheck --ping
      interval: 30s
      timeout: 1s
      retries: 3
      start_period: 10s
    labels:
      traefik.enable: "true"
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
      traefik.http.routers.traefik.rule: Host(`traefik.atlas.axatol.xyz`)
      traefik.http.routers.traefik.tls.certresolver: letsencrypt

volumes:
  unbound-state:
