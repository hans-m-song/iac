deployment:
  strategy:
    type: Recreate

containers:
  gluetun:
    image: qmcgaw/gluetun
    securityContext:
      capabilities:
        add:
          - NET_ADMIN
    livenessProbe:
      exec:
        command: /gluetun-entrypoint, healthcheck
      initialDelaySeconds: 30
      periodSeconds: 5
      timeoutSeconds: 5
    volumes:
      tun:
        mount:
          mountPath: /dev/net/tun
          readOnly: false
        spec:
          hostPath:
            path: /dev/net/tun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    securityContext: false
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: Australia/Brisbane
      WEBUI_PORT: "9696"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
    volumes:
      config:
        mount:
          mountPath: /config
          subPath: prowlarr
          readOnly: false
        spec:
          persistentVolumeClaim:
            claimName: indexers-config
    ports:
      prowlarr:
        protocol: TCP
        internalPort: 9696
        externalPort: 9696
    readinessProbe:
      tcpSocket:
        port: 9696
      initialDelaySeconds: 60
      periodSeconds: 60

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    securityContext: false
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: Australia/Brisbane
      WEBUI_PORT: "7878"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
    volumes:
      config:
        mount:
          mountPath: /config
          subPath: radarr
          readOnly: false
        spec:
          persistentVolumeClaim:
            claimName: indexers-config
      data:
        mount:
          mountPath: /data
          subPath: radarr
        spec:
          persistentVolumeClaim:
            claimName: indexers-data
    ports:
      radarr:
        protocol: TCP
        internalPort: 7878
        externalPort: 7878
    readinessProbe:
      tcpSocket:
        port: 7878
      initialDelaySeconds: 60
      periodSeconds: 60

  readarr:
    image: lscr.io/linuxserver/readarr:develop
    securityContext: false
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: Australia/Brisbane
      WEBUI_PORT: "8989"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
    volumes:
      config:
        mount:
          mountPath: /config
          subPath: readarr
          readOnly: false
        spec:
          persistentVolumeClaim:
            claimName: indexers-config
      data:
        mount:
          mountPath: /data
          subPath: readarr
        spec:
          persistentVolumeClaim:
            claimName: indexers-data
    ports:
      readarr:
        protocol: TCP
        internalPort: 8787
        externalPort: 8787
    readinessProbe:
      tcpSocket:
        port: 8787
      initialDelaySeconds: 60
      periodSeconds: 60

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    securityContext: false
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: Australia/Brisbane
      WEBUI_PORT: "8989"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
    volumes:
      config:
        mount:
          mountPath: /config
          subPath: sonarr
          readOnly: false
        spec:
          persistentVolumeClaim:
            claimName: indexers-config
      data:
        mount:
          mountPath: /data
          subPath: sonarr
        spec:
          persistentVolumeClaim:
            claimName: indexers-data
    ports:
      sonarr:
        protocol: TCP
        internalPort: 8989
        externalPort: 8989
    readinessProbe:
      tcpSocket:
        port: 8989
      initialDelaySeconds: 60
      periodSeconds: 60

ingress:
  ingressClassName: traefik
  hosts:
    prowlarr.axatol.local:
      - path: /
        portName: prowlarr
    radarr.axatol.local:
      - path: /
        portName: radarr
    readarr.axatol.local:
      - path: /
        portName: readarr
    sonarr.axatol.local:
      - path: /
        portName: sonarr

pvc:
  indexers-config:
    storageClassName: nfs-persistent
    capacity: 1Gi
  indexers-data:
    storageClassName: nfs-persistent
    capacity: 1Gi

networkPolicy:
  ingress:
    - cidr: 192.168.1.41/32
    - namespace: media
  egress:
    - cidr: 192.168.1.41/32
    - namespace: media
    - cidr: 0.0.0.0/0
    # skyhook.sonarr.tv
    - cidr: 104.26.0.163/32
    - cidr: 172.67.70.98/32
    - cidr: 104.26.1.163/32
